<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hasiera orria</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="Styles/General.css">
  </head>
<body>
    <header class="site-header">
      <div class="header-inner container d-flex align-items-center justify-content-between gap-3 py-2">
        <div class="left d-flex align-items-center gap-2">
          <button id="menuBtn" class="icon-btn" aria-label="Menu" aria-expanded="false">☰</button>
          <span class="brand" id="brand">GRAL gida</span>
        </div>
        <nav id="nav" class="nav-links d-flex align-items-center gap-3" aria-label="Primary">
          <a href="hasiera_orria.html" data-i18n="nav.home">Hasiera</a>
        </nav>
        <div class="actions d-flex align-items-center gap-2">
          <select id="langSelect" aria-label="Idioma">
            <option value="es">ES</option>
            <option value="eu">EU</option>
            <option value="en">EN</option>
            <option value="sw">SW</option>
            <option value="eo">EO</option>
            <option value="yue">YUE</option>
          </select>
          <button id="themeToggle" class="icon-btn" aria-pressed="false" title="Tema">🌓</button>
          <a href="#" id="loginBtn" class="btn" data-i18n="auth.login">Log in</a>
          <a href="#" id="signupBtn" class="btn primary" data-i18n="auth.signup">Sign up</a>
        </div>
      </div>
      <div id="backdrop" class="backdrop" hidden></div>
      <aside id="sideMenu" class="side-menu" aria-hidden="true">
        <div class="side-menu-inner d-flex flex-column gap-2 p-3">
          <a href="./gral_adibideak.html" class="btn">GRAL Adibideak</a>
          <a href="" class="btn">boton2</a>
          <a href="" class="btn">boton3</a>
          <a href="" class="btn">boton4</a>
          <a href="" class="btn">boton5</a>
        </div>
      </aside>
    </header>

    <script>
      (function() {
        var body = document.body;
        var themeToggle = document.getElementById('themeToggle');
        var menuBtn = document.getElementById('menuBtn');
        var nav = document.getElementById('nav');
        var langSelect = document.getElementById('langSelect');
        var title = document.getElementById('title');
        var loginBtn = document.getElementById('loginBtn');
        var signupBtn = document.getElementById('signupBtn');
        var subtitle = document.getElementById('subtitle');
        var sideMenu = document.getElementById('sideMenu');
        var backdrop = document.getElementById('backdrop');

        var dict = {
          es: {
            auth: { login: 'Iniciar sesión', signup: 'Crear cuenta' },
            nav: { home: 'Inicio' },
            image: { placeholder: 'Imagen / banner pendiente' },
            footer: {
              blog: 'Blog',
              donations: 'Donaciones',
              forum: 'Foro',
              external_links: 'Enlaces externos',
              available_app_store: 'Disponible en App Store',
              available_google_play: 'Disponible en Google Play',
              about_us: 'Sobre nosotros',
              contact_us: 'Contáctanos',
              faqs: 'FAQs', x: 'X', yt: 'YT', instagram: 'Instagram'
            },
            messages: { under_construction: 'Página web en construcción', close: 'Cerrar' }
          },
          eu: {
            auth: { login: 'Saioa hasi', signup: 'Erregistratu' },
            nav: { home: 'Hasiera' },
            footer: {
              blog: 'Blog-a',
              donations: 'Diru-donazioak',
              forum: 'Foroa',
              external_links: 'Kanpo estekak',
              available_app_store: 'App Store-n eskuragarri',
              available_google_play: 'Google Play-n eskuragarri',
              about_us: 'Nor gara',
              contact_us: 'Idatzi gaitzazu',
              faqs: 'FAQs', x: 'X', yt: 'YT', instagram: 'Instagram'
            },
            messages: { under_construction: 'Webgunea eraikitzen ari da', close: 'Itxi' }
          },
          en: {
            auth: { login: 'Log in', signup: 'Sign up' },
            nav: { home: 'Home' },
            footer: {
              blog: 'Blog',
              donations: 'Donations',
              forum: 'Forum',
              external_links: 'External links',
              available_app_store: 'Available on App Store',
              available_google_play: 'Available on Google Play',
              about_us: 'About us',
              contact_us: 'Contact us',
              faqs: 'FAQs', x: 'X', yt: 'YT', instagram: 'Instagram'
            },
            messages: { under_construction: 'Website under construction', close: 'Close' }
          },
          sw: {
            auth: { login: 'Ingia', signup: 'Jisajili' },
            nav: { home: 'Nyumbani' },
            footer: {
              blog: 'Blogu',
              donations: 'Michango',
              forum: 'Jukwaa',
              external_links: 'Viungo vya nje',
              available_app_store: 'Inapatikana kwenye App Store',
              available_google_play: 'Inapatikana kwenye Google Play',
              about_us: 'Kuhusu sisi',
              contact_us: 'Wasiliana nasi',
              faqs: 'FAQs', x: 'X', yt: 'YT', instagram: 'Instagram'
            },
            messages: { under_construction: 'Tovuti inaendelea kujengwa', close: 'Funga' }
          },
          eo: {
            auth: { login: 'Ensaluti', signup: 'Registriĝi' },
            nav: { home: 'Hejmo' },
            footer: {
              blog: 'Blogo',
              donations: 'Donacoj',
              forum: 'Forumo',
              external_links: 'Eksteraj ligiloj',
              available_app_store: 'Disponebla en App Store',
              available_google_play: 'Disponebla en Google Play',
              about_us: 'Pri ni',
              contact_us: 'Kontaktu nin',
              faqs: 'FAQs', x: 'X', yt: 'YT', instagram: 'Instagram'
            },
            messages: { under_construction: 'Retejo konstruata', close: 'Fermi' }
          },
          yue: {
            auth: { login: '登入', signup: '註冊' },
            nav: { home: '主頁' },
            footer: {
              blog: '博客',
              donations: '捐款',
              forum: '論壇',
              external_links: '外部連結',
              available_app_store: '可於 App Store 下載',
              available_google_play: '可於 Google Play 下載',
              about_us: '關於我們',
              contact_us: '聯絡我們',
              faqs: 'FAQs', x: 'X', yt: 'YT', instagram: 'Instagram'
            },
            messages: { under_construction: '網站建設中', close: '關閉' }
          }
        };

        try {
          var savedTheme = localStorage.getItem('theme');
          if (savedTheme === 'dark') body.classList.add('dark');
          var savedLang = localStorage.getItem('lang') || 'eu';
          langSelect.value = savedLang;
          applyLang(savedLang);
          themeToggle.textContent = body.classList.contains('dark') ? '🌞' : '🌓';
        } catch (e) {}

        themeToggle.addEventListener('click', function() {
          var isDark = body.classList.toggle('dark');
          themeToggle.setAttribute('aria-pressed', String(isDark));
          themeToggle.textContent = isDark ? '🌞' : '🌓';
          try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch (e) {}
        });

        function openMenu() {
          sideMenu.classList.add('open');
          backdrop.hidden = false;
          menuBtn.setAttribute('aria-expanded', 'true');
          sideMenu.setAttribute('aria-hidden', 'false');
        }
        function closeMenu() {
          sideMenu.classList.remove('open');
          backdrop.hidden = true;
          menuBtn.setAttribute('aria-expanded', 'false');
          sideMenu.setAttribute('aria-hidden', 'true');
        }
        menuBtn.addEventListener('click', function() {
          if (sideMenu.classList.contains('open')) closeMenu(); else openMenu();
        });
        backdrop.addEventListener('click', closeMenu);
        window.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeMenu(); });

        langSelect.addEventListener('change', function() {
          var lng = langSelect.value;
          applyLang(lng);
          try { localStorage.setItem('lang', lng); } catch (e) {}
        });

        function applyLang(lng) {
          var t = dict[lng] || dict['en'];
          title.textContent = t.title;
          subtitle.textContent = t.subtitle;
          loginBtn.textContent = t.auth.login;
          signupBtn.textContent = t.auth.signup;
          var navLinks = nav.querySelectorAll('a');
          if (navLinks[0]) navLinks[0].textContent = t.nav.home;
          var ph = document.getElementById('imgPh');
          if (ph) ph.textContent = t.image.placeholder;
          // Footer translations if footer is present
          try {
            var f1 = document.getElementById('link1');
            var f2 = document.getElementById('link2');
            var f3 = document.getElementById('link3');
            var f4 = document.getElementById('link4');
            var f5 = document.getElementById('link5');
            var f6 = document.getElementById('link6');
            var f7 = document.getElementById('link7');
            var f8 = document.getElementById('link8');
            var f9 = document.getElementById('link9');
            var f10 = document.getElementById('link10');
            var appstore = document.getElementById('appstore');
            var playstore = document.getElementById('playstore');
            if (f1) f1.textContent = t.footer.blog;
            if (f2) f2.textContent = t.footer.donations;
            if (f3) f3.textContent = t.footer.forum;
            if (f4) f4.textContent = t.footer.external_links;
            if (f5) f5.textContent = t.footer.faqs;
            if (f6) f6.textContent = t.footer.about_us;
            if (f7) f7.textContent = t.footer.contact_us;
            if (f8) f8.textContent = t.footer.x;
            if (f9) f9.textContent = t.footer.yt;
            if (f10) f10.textContent = t.footer.instagram;
            if (appstore) appstore.textContent = t.footer.available_app_store;
            if (playstore) playstore.textContent = t.footer.available_google_play;
          } catch(e) {}
          // expose under_construction message for external scripts
          try {
            document.documentElement.setAttribute('data-uc-msg', t.messages.under_construction);
            document.documentElement.setAttribute('data-close-label', t.messages.close);
            var closeBtn = document.getElementById('uc-close');
            if (closeBtn) closeBtn.textContent = t.messages.close;
          } catch(e) {}
        }
      })();
    </script>
  </body>
 </html>
