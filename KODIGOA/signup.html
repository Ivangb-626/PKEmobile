<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign up</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../Styles/General.css">
  </head>
  <body>
    <div id="header-root"></div>

    <main class="container py-4">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6">
          <div class="card" style="border-color: var(--border); background: var(--bg); color: var(--fg);">
            <div class="card-body">
              <h1 class="h4 mb-3" id="heading">Sign up</h1>
              <div class="d-flex justify-content-between align-items-center mb-3">
                <span id="haveAccountText">Do you already have an account? </span>
                <a href="login.html" id="toLogin" class="btn btn-outline-primary ms-2">Go to Login</a>
              </div>
              <div id="msg" class="alert d-none" role="alert"></div>
              <form id="signupForm" novalidate>
                <div class="mb-3">
                  <label for="username" class="form-label" id="labelUsername">Usuario</label>
                  <input type="text" class="form-control" id="username" required />
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label" id="labelPassword">Contraseña</label>
                  <div class="input-group">
                    <input type="password" class="form-control" id="password" required />
                    <button type="button" id="togglePwd1" class="btn btn-outline-secondary" aria-pressed="false" aria-label="Mostrar contraseña">👁️</button>
                  </div>
                </div>
                <div class="mb-3">
                  <label for="password2" class="form-label" id="labelPassword2">Repite la contraseña</label>
                  <div class="input-group">
                    <input type="password" class="form-control" id="password2" required />
                    <button type="button" id="togglePwd2" class="btn btn-outline-secondary" aria-pressed="false" aria-label="Mostrar contraseña">👁️</button>
                  </div>
                </div>
                <div class="d-flex gap-2">
                  <button type="submit" id="createBtn" class="btn btn-primary">Crear cuenta</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="footer-root"></div>

    <script src="insertheaderfooter.js"></script>

    <script>
      (function(){
        var form = document.getElementById('signupForm');
        var u = document.getElementById('username');
        var p1 = document.getElementById('password');
        var p2 = document.getElementById('password2');
        var msg = document.getElementById('msg');
        var LS_KEY = 'auth_users';
        var CURRENT_KEY = 'auth_current_user';

        function getUsers(){
          try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch(e) { return {}; }
        }
        function saveUsers(obj){
          try { localStorage.setItem(LS_KEY, JSON.stringify(obj)); } catch(e) {}
        }
        function setCurrentUser(username){
          try { localStorage.setItem(CURRENT_KEY, username); } catch(e) {}
        }
        function show(type, text){
          msg.className = 'alert alert-' + type;
          msg.textContent = text;
          msg.classList.remove('d-none');
        }
        function localizeFromHeader(){
          var tx = (window.appTranslations && window.appTranslations.signup) || null;
          if (!tx) return;
          document.getElementById('heading').textContent = tx.heading;
          document.getElementById('labelUsername').textContent = tx.user;
          document.getElementById('labelPassword').textContent = tx.pass;
          document.getElementById('labelPassword2').textContent = tx.pass2;
          document.getElementById('createBtn').textContent = tx.submit;
          var toLogin = document.getElementById('toLogin');
          if (toLogin) toLogin.textContent = tx.tologin;
          var haveAcc = document.getElementById('haveAccountText');
          if (haveAcc) haveAcc.textContent = tx.haveaccount || haveAcc.textContent;
        }
        localizeFromHeader();
        window.addEventListener('lang:changed', localizeFromHeader);

        form.addEventListener('submit', function(e){
          e.preventDefault();
          var username = u.value.trim();
          var pass1 = p1.value;
          var pass2 = p2.value;
          var tx = (window.appTranslations && window.appTranslations.signup) || {};
          if (!username || !pass1 || !pass2) { show('warning', tx.missing || 'Fill username and both passwords'); return; }
          if (pass1 !== pass2) { show('warning', tx.nomatch || 'Passwords do not match'); return; }
          var users = getUsers();
          if (users[username]) { show('warning', tx.exists || 'User already exists'); return; }
          users[username] = pass1;
          saveUsers(users);
          setCurrentUser(username);
          show('success', tx.created || 'User created and logged in');
          try {
            var last = localStorage.getItem('last_page') || 'hasiera_orria.html';
            if (/\/(login|signup)\.html$/i.test(new URL(last, location.href).pathname)) last = 'hasiera_orria.html';
            setTimeout(function(){ location.href = last; }, 400);
          } catch(e) { location.href = 'hasiera_orria.html'; }
        });

        // Toggle password visibility for both fields
        (function setupToggles(){
          function wire(btnId, inputId){
            var btn = document.getElementById(btnId);
            var inp = document.getElementById(inputId);
            if (!btn || !inp) return;
            btn.addEventListener('click', function(){
              var showing = inp.getAttribute('type') === 'text';
              inp.setAttribute('type', showing ? 'password' : 'text');
              btn.textContent = showing ? '👁️' : '🙈';
              btn.setAttribute('aria-pressed', String(!showing));
            });
          }
          wire('togglePwd1', 'password');
          wire('togglePwd2', 'password2');
        })();
      })();
    </script>
  </body>
</html>
