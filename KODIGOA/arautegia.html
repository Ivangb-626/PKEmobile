    <!-- Sincronizar tema (modo oscuro/claro) -->
    <script>
      (function(){
        function applyThemeFromStorage(){
          try{
            const t = localStorage.getItem('theme');
            if(t === 'dark') document.body.classList.add('dark');
            else document.body.classList.remove('dark');
          }catch(e){}
        }
        // aplicar inmediatamente al parsear el script
        applyThemeFromStorage();

        // reaccionar al evento emitido por el header cuando cambia el tema
        window.addEventListener('theme:changed', function(e){
          try{
            const theme = e && e.detail && e.detail.theme;
            if(theme === 'dark') document.body.classList.add('dark');
            else document.body.classList.remove('dark');
          }catch(e){}
        });

        // sincronizar cambios desde otras pestañas
        window.addEventListener('storage', function(e){
          if(e.key === 'theme') applyThemeFromStorage();
        });
      })();
    </script>

            function getLang(){
                return localStorage.getItem('lang') || 'eu';
            }

            function applyTranslations(){
                const lang = getLang();
                const map = dict[lang] || dict.eu;

                // document title
                const titleEl = document.querySelector('title[data-i18n], title');
                if(titleEl){
                    const key = titleEl.getAttribute('data-i18n');
                    if(key && map[key]) titleEl.textContent = map[key];
                    else if(map.pageTitle) titleEl.textContent = map.pageTitle;
                }

                // elements with data-i18n (skip title which is handled)
                document.querySelectorAll('body [data-i18n]').forEach(el=>{
                    const key = el.getAttribute('data-i18n');
                    if(!key) return;
                    if(map[key] !== undefined) el.innerHTML = map[key];
                });
            }

            // Expose function for header to call
            window.applyArautegiaTranslations = applyTranslations;

            // React to storage changes (other tabs/windows)
            window.addEventListener('storage', function(e){
                if(e.key === 'lang') applyTranslations();
            });

            // Custom event listener: header dispatches 'lang:changed'
            window.addEventListener('langChanged', applyTranslations);
            // --- ADDED: also listen for the header's custom event name 'lang:changed' ---
            window.addEventListener('lang:changed', applyTranslations);

            // Polling fallback for same-tab changes
            let lastLang = getLang();
            const pollInterval = setInterval(function(){
                const current = getLang();
                if(current !== lastLang){
                    lastLang = current;
                    applyTranslations();
                }
            }, 300);

            // Apply on load
            document.addEventListener('DOMContentLoaded', function(){
                applyTranslations();
            });

            // Cleanup helper (optional)
            window.__cleanupArautegiaLangPoll = function(){
                clearInterval(pollInterval);
                window.removeEventListener('langChanged', applyTranslations);
                window.removeEventListener('lang:changed', applyTranslations);
                window.removeEventListener('storage', applyTranslations);
            };
        })();
    </script>
